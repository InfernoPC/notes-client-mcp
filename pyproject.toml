[project]
name = "notes-client-mcp"
version = "0.1.0"
description = "Read-only MCP server for a local HCL Notes Client via backend COM automation"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "pywin32; platform_system == 'Windows'",
]

[project.scripts]
notes-client-mcp = "notes_mcp.server:main"
notes-host-agent = "notes_mcp.host_agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
