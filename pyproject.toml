[project]
name = "notes-client-mcp"
version = "1.2.0"
description = "MCP access to a local HCL Notes Client via backend COM automation"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pywin32; platform_system == 'Windows'",
]

[project.scripts]
# One command per tool-tier profile - see README.md for which to register
# with your MCP client. Each is a full, standalone process (COM + MCP stdio).
notes-client-mcp = "notes_mcp.server:main_read"
notes-client-mcp-design = "notes_mcp.server:main_design"
notes-client-mcp-write = "notes_mcp.server:main_write"
notes-client-mcp-all = "notes_mcp.server:main_all"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
